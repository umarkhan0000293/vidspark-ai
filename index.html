<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidSpark AI – Turn your prompt into video</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #fff;
      --text: #14162b;
      --muted: #5b6078;
      --border: #e2e5f0;
      --brand: #6d4aff;
      --brand2: #ff4a9e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, Arial, sans-serif; line-height: 1.5;
    }
    .wrap { max-width: 1000px; margin: auto; padding: 0 16px; }
    header { border-bottom: 1px solid var(--border); background: var(--bg); }
    .nav { display: flex; justify-content: space-between; align-items: center; height: 60px; }
    .logo { font-weight: 800; font-size: 1.2rem; text-decoration: none; color: var(--text); }
    .logo span { color: var(--brand); }
    .hero { text-align: center; padding: 40px 0 20px; }
    h1 { font-size: 2.2rem; margin: 10px 0; }
    h1 em { color: var(--brand); font-style: normal; }
    .hero p { color: var(--muted); max-width: 600px; margin: auto; }
    .studio { display: grid; gap: 16px; padding: 20px 0 40px; }
    @media(min-width: 850px){ .studio { grid-template-columns: 1.1fr .9fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    label { font-weight: 700; display: block; margin: 12px 0 6px; }
    textarea, select {
      width: 100%; padding: 12px; font: inherit; border: 1px solid var(--border);
      border-radius: 12px; background: var(--bg); color: var(--text);
    }
    textarea { min-height: 160px; resize: vertical; }
    .options { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .options.four { grid-template-columns: repeat(3,1fr); }
    .opt input { display: none; }
    .opt span {
      display: block; text-align: center; padding: 10px; border: 2px solid var(--border);
      border-radius: 10px; cursor: pointer; font-weight: 700; background: var(--bg);
    }
    .opt input:checked + span { border-color: var(--brand); background: #eee9ff; }
    .btn {
      width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .status { display: none; margin-top: 12px; padding: 10px; border-radius: 10px; font-size: .9rem; }
    .status.show { display: block; }
    .status.warn { background: #fff6e0; color: #6b4a00; }
    .status.ok { background: #e8f7ee; color: #11592f; }
    .stage {
      width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; color: #aaa; text-align: center;
      overflow: hidden;
    }
    .stage video { width: 100%; height: 100%; object-fit: contain; }
    footer { text-align: center; color: var(--muted); padding: 20px 0 40px; font-size: .9rem; }
  </style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="#">Vid<span>Spark</span> AI</a>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>Turn your prompt into <em>real AI video</em></h1>
    <p>Describe any scene and create an AI-generated video.</p>
  </section>

  <section class="studio">

    <div class="card">
      <h2>1. Your prompt</h2>

      <label for="prompt">Write your scene</label>
      <textarea id="prompt" placeholder="Example: An American family browsing a household-goods aisle. A parent compares two products while a child looks at nearby items. Warm lighting, gentle camera push-in. No text or captions."></textarea>

      <label>Aspect ratio</label>
      <div class="options">
        <label class="opt">
          <input type="radio" name="ratio" value="16:9" checked>
          <span>16:9</span>
        </label>
        <label class="opt">
          <input type="radio" name="ratio" value="9:16">
          <span>9:16</span>
        </label>
        <label class="opt">
          <input type="radio" name="ratio" value="1:1">
          <span>1:1</span>
        </label>
      </div>

      <label>Video length</label>
      <div class="options four">
        <label class="opt">
          <input type="radio" name="duration" value="15" checked>
          <span>15 sec</span>
        </label>
        <label class="opt">
          <input type="radio" name="duration" value="30">
          <span>30 sec</span>
        </label>
        <label class="opt">
          <input type="radio" name="duration" value="90">
          <span>90 sec</span>
        </label>
      </div>

      <button class="btn" id="generateBtn">Create Video</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>2. Preview</h2>
      <div class="stage" id="stage">
        <div>No video yet</div>
      </div>
      <button class="btn" id="downloadBtn" disabled style="background:#fff;color:#14162b;border:1px solid var(--border)">Download Video</button>
    </div>

  </section>

</main>

<footer>VidSpark AI</footer>

<script>
const BACKEND_URL = "https://YOUR-BACKEND-URL.vercel.app/api/generate-video";

const promptInput = document.getElementById("prompt");
const generateBtn = document.getElementById("generateBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusBox = document.getElementById("status");
const stage = document.getElementById("stage");

let videoUrl = "";
let busy = false;

function showStatus(text, type = "warn") {
  statusBox.textContent = text;
  statusBox.className = "status show " + type;
}

function selected(name) {
  return document.querySelector(`input[name="${name}"]:checked`).value;
}

async function createVideo() {
  if (busy) return;

  const prompt = promptInput.value.trim();

  if (!prompt) {
    showStatus("Please write a prompt first.");
    return;
  }

  busy = true;
  generateBtn.disabled = true;
  downloadBtn.disabled = true;
  showStatus("Creating your AI video...");

  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt,
        aspectRatio: selected("ratio"),
        duration: selected("duration") + "s"
      })
    });

    const data = await res.json();

    if (!res.ok || !data.videoUrl) {
      throw new Error(data.error || "Video generation failed.");
    }

    videoUrl = data.videoUrl;

    stage.innerHTML = `<video src="${videoUrl}" controls playsinline></video>`;
    downloadBtn.disabled = false;
    showStatus("Your video is ready.", "ok");

  } catch (err) {
    showStatus(err.message || "Something went wrong.");
  } finally {
    busy = false;
    generateBtn.disabled = false;
  }
}

downloadBtn.onclick = () => {
  if (!videoUrl) return;
  const a = document.createElement("a");
  a.href = videoUrl;
  a.download = "vidspark-video.mp4";
  a.click();
};

generateBtn.onclick = createVideo;
</script>

</body>
</html>
